name: search-ping

# Manual only. No cron and no run after Pages deploy.
on:
  workflow_dispatch:
    inputs:
      all:
        description: Submit every collected URL
        type: boolean
        default: true

concurrency:
  group: search-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit URLs
        run: node scripts/search-engines-ping.mjs --all
