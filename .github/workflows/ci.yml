name: ci

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Build before tests: performance + asset gates require dist-assets (full stage).
      # Vitest globalSetup only generates HTML shells and is not a substitute for npm run build.
      - run: npm run build
      - run: npm test
      - run: npm run asset:manifest
