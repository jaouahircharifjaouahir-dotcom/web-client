name: production-smoke-scheduled

on:
  schedule:
    # Twice daily — low-traffic subset only (does not gate Cloudflare deploys)
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production smoke (scheduled subset)
        run: npm run production:smoke:scheduled
        env:
          SMOKE_EXPECTED_SITEMAP_LOCS: "1095"
